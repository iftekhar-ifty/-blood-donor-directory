<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rokto Bondhu — Blood Donor Directory</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        blood: '#B0142A',
        'blood-deep': '#7C0F1F',
        'blood-tint': '#FBEEF1',
        ink: '#16161A',
        'ink-soft': '#54545C',
        'ink-mute': '#8C8C94',
        line: '#E8E6E8',
        'line-soft': '#F0EEF0',
        bg: '#F6F5F7',
        good: '#1B7A4A',
        'good-tint': '#E8F3EC',
      },
      fontFamily: {
        sans: ['"Hanken Grotesk"', 'system-ui', 'sans-serif'],
        mono: ['"JetBrains Mono"', 'monospace'],
      }
    }
  }
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    background: #C9C5CB;
    color: #16161A;
    overscroll-behavior-y: none;
  }
  [x-cloak] { display: none !important; }
  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum"; }
  
  .app-shell {
    max-width: 430px;
    margin: 0 auto;
    background: #F6F5F7;
    min-height: 100vh;
    position: relative;
    box-shadow: 0 0 80px rgba(0,0,0,0.12);
  }
  
  @media (min-width: 768px) {
    body { padding: 28px 0; background: #B5B1B7; }
    .app-shell {
      min-height: calc(100vh - 56px);
      border-radius: 36px;
      overflow: hidden;
      border: 1px solid #A4A0A6;
    }
  }
  
  .view-enter { animation: viewIn 0.28s ease-out; }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, #ececee 25%, #f5f4f6 50%, #ececee 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  
  .sheet-enter { animation: sheetIn 0.32s cubic-bezier(0.2, 0.9, 0.3, 1); }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .dialog-enter { animation: dialogIn 0.25s cubic-bezier(0.2, 0.9, 0.3, 1); }
  @keyframes dialogIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .backdrop-enter { animation: fadeIn 0.22s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  .toast-enter { animation: toastIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes pulseRing {
    0% { transform: scale(1); opacity: 0.35; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .pulse-ring { animation: pulseRing 2.6s ease-out infinite; }
  
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid #B0142A;
    outline-offset: 2px;
  }
  
  .avatar-a { background: #FBE7E9; color: #9A1227; }
  .avatar-b { background: #E8F0FB; color: #1E4D8C; }
  .avatar-c { background: #FBF3E7; color: #8C4F0B; }
  .avatar-d { background: #EAF3EA; color: #1B7A4A; }
  
  .no-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .no-scroll { scrollbar-width: none; }
  
  .donor-card { position: relative; }
  .donor-card.is-available::before {
    content: '';
    position: absolute;
    left: -1px; top: 14px; bottom: 14px;
    width: 3px;
    background: #1B7A4A;
    border-radius: 0 2px 2px 0;
  }
  
  input[type=date]::-webkit-calendar-picker-indicator {
    opacity: 0.5;
    cursor: pointer;
  }
  
  .bottom-nav { padding-bottom: env(safe-area-inset-bottom, 0px); }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
    .pulse-ring { animation: none; }
  }
</style>
</head>
<body x-data="donorApp()" x-cloak>

<div class="app-shell flex flex-col">

  <main class="flex-1">

    <!-- ============== SPLASH ============== -->
    <template x-if="view === 'splash'">
      <div class="view-enter min-h-screen flex flex-col justify-between px-6 pt-10 pb-8 bg-white">
        <div class="flex items-center gap-2">
          <svg class="w-7 h-7 text-blood" viewBox="0 0 24 24" fill="none">
            <path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0c0-5-6.5-12.5-6.5-12.5z" fill="currentColor"/>
          </svg>
          <span class="text-[16px] font-bold tracking-tight">Rokto Bondhu</span>
        </div>
        
        <div class="flex flex-col items-center text-center max-w-[300px] mx-auto">
          <div class="relative mb-10">
            <div class="absolute inset-0 rounded-full border-2 border-blood pulse-ring"></div>
            <div class="w-28 h-28 rounded-full bg-blood-tint flex items-center justify-center relative">
              <svg class="w-14 h-14 text-blood" viewBox="0 0 24 24" fill="none">
                <path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0c0-5-6.5-12.5-6.5-12.5z" fill="currentColor"/>
              </svg>
            </div>
          </div>
          
          <h1 class="text-[28px] leading-[1.15] font-bold tracking-tight text-ink">
            Blood donors,<br/>one tap away.
          </h1>
          <p class="text-[14.5px] text-ink-soft mt-3.5 leading-relaxed px-2">
            Register as a donor. Help someone in your area find the right blood group when they need it most.
          </p>
        </div>
        
        <div class="space-y-2">
          <button @click="view = 'register'" class="w-full bg-blood text-white py-3.5 rounded-lg font-semibold text-[15px] hover:bg-blood-deep active:scale-[0.99] transition">
            Become a Donor
          </button>
          <button @click="view = 'login'" class="w-full text-ink py-2.5 text-[14px] font-medium">
            Already have an account? <span class="text-blood font-semibold">Login</span>
          </button>
        </div>
      </div>
    </template>

    <!-- ============== LOGIN ============== -->
    <template x-if="view === 'login'">
      <div class="view-enter min-h-screen bg-bg">
        <div class="sticky top-0 z-20 bg-white border-b border-line">
          <div class="px-2 py-3 flex items-center gap-2">
            <button @click="view = 'splash'" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-line-soft" aria-label="Go back">
              <svg class="w-5 h-5 text-ink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>
            </button>
            <h1 class="text-[16px] font-semibold">Login</h1>
          </div>
        </div>
        
        <div class="px-4 py-6">
          <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto rounded-full bg-blood-tint flex items-center justify-center mb-3">
              <svg class="w-8 h-8 text-blood" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0c0-5-6.5-12.5-6.5-12.5z"/></svg>
            </div>
            <h2 class="text-[20px] font-bold tracking-tight">Welcome back</h2>
            <p class="text-[13px] text-ink-soft mt-1">Login to manage your donor profile</p>
          </div>
          
          <form @submit.prevent="submitLogin()" class="space-y-3">
            <div>
              <label for="login-id" class="block text-[12.5px] font-medium text-ink-soft mb-1.5">Phone Number / Username</label>
              <input id="login-id" type="text" x-model="loginForm.identifier" placeholder="01XXXXXXXXX or username" class="w-full px-3 py-3 text-[14px] bg-white border border-line rounded-md focus:border-blood outline-none">
            </div>
            <div>
              <label for="login-pass" class="block text-[12.5px] font-medium text-ink-soft mb-1.5">Password</label>
              <input id="login-pass" type="password" x-model="loginForm.password" placeholder="Enter your password" class="w-full px-3 py-3 text-[14px] bg-white border border-line rounded-md focus:border-blood outline-none">
            </div>
            
            <button type="submit" class="w-full bg-blood text-white py-3.5 rounded-lg font-semibold text-[15px] hover:bg-blood-deep active:scale-[0.99] transition">
              Login
            </button>
          </form>
          
          <div class="flex items-center justify-between mt-4 text-[12.5px]">
            <button @click="showToast('Password reset not available in demo', 'info')" class="text-ink-soft hover:text-blood">Forgot Password?</button>
            <button @click="view = 'register'" class="text-blood font-semibold">Create New Profile</button>
          </div>
          
          <div class="mt-8 p-3 bg-blood-tint rounded-lg text-[12px] text-ink-soft leading-relaxed border border-blood/10">
            <strong class="text-blood">Demo:</strong> Enter any identifier and password, then click Login to explore.
          </div>
        </div>
      </div>
    </template>

    <!-- ============== REGISTER ============== -->
    <template x-if="view === 'register'">
      <div class="view-enter min-h-screen bg-bg">
        <div class="sticky top-0 z-20 bg-white border-b border-line">
          <div class="px-2 py-3 flex items-center gap-2">
            <button @click="view = 'splash'" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-line-soft" aria-label="Go back">
              <svg class="w-5 h-5 text-ink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>
            </button>
            <h1 class="text-[16px] font-semibold">Become a Blood Donor</h1>
          </div>
        </div>
        
        <div class="px-4 py-4">
          <p class="text-[13.5px] text-ink-soft mb-5 leading-relaxed">
            Create your donor profile and help someone find the right blood group when they need it.
          </p>
          
          <form @submit.prevent="submitRegister()">
            <div class="text-[11px] uppercase tracking-[0.08em] font-semibold text-ink-mute mb-2">Personal Information</div>
            <div class="bg-white border border-line rounded-lg p-3.5 space-y-3 mb-4">
              <div>
                <label class="block text-[12.5px] font-medium text-ink-soft mb-1.5">Full Name *</label>
                <input type="text" x-model="registerForm.name" placeholder="Md. Rahim Ahmed" class="w-full px-3 py-2.5 text-[14px] bg-white border border-line rounded-md focus:border-blood outline-none">
              </div>
              <div>
                <label class="block text-[12.5px] font-medium text-ink-soft mb-1.5">Phone Number *</label>
                <input type="tel" x-model="registerForm.phone" placeholder="01XXXXXXXXX" class="w-full px-3 py-2.5 text-[14px] bg-white border border-line rounded-md focus:border-blood outline-none mono">
              </div>
              <div>
                <label class="block text-[12.5px] font-medium text-ink-soft mb-1.5">Unique Username *</label>
                <input type="text" x-model="registerForm.username" placeholder="rahim_ahmed" 
                  class="w-full px-3 py-2.5 text-[14px] bg-white border rounded-md focus:border-blood outline-none mono"
                  :class="usernameStatus === 'taken' ? 'border-blood' : usernameStatus === 'available' ? 'border-good' : 'border-line'">
                <template x-if="usernameStatus === 'available'">
                  <p class="text-[11.5px] text-good mt-1 flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-9"/></svg>
                    Username available
                  </p>
                </template>
                <template x-if="usernameStatus === 'taken'">
                  <p class="text-[11.5px] text-blood mt-1 flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    Username already taken
                  </p>
                </template>
              </div>
            </div>
            
            <div class="text-[11px] uppercase tracking-[0.08em] font-semibold text-ink-mute mb-2">Location Information</div>
            <div class="bg-white border border-line rounded-lg p-3.5 space-y-3 mb-4">
              <div>
                <label class="block text-[12.5px] font-medium text-ink-soft mb-1.5">District (Zila) *</label>
                <select x-model="registerForm.district" class="w-full px-3 py-2.5 text-[14px] bg-white border border-line rounded-md focus:border-blood outline-none">
                  <option value="">Select district</option>
                  <template x-for="d in districts" :key="d">
                    <option :value="d" x-text="d"></option>
                  </template>
                </select>
              </div>
              <div>
                <label class="block text-[12.5px] font-medium text-ink-soft mb-1.5">Union</label>
                <input type="text" x-model="registerForm.union" placeholder="Barura Union" class="w-full px-3 py-2.5 text-[14px] bg-white border border-line rounded-md focus:border-blood outline-none">
              </div>
              <div>
                <label class="block text-[12.5px] font-medium text-ink-soft mb-1.5">Village</label>
                <input type="text" x-model="registerForm.village" placeholder="West Village" class="w-full px-3 py-2.5 text-[14px] bg-white border border-line rounded-md focus:border-blood outline-none">
              </div>
            </div>
            
            <div class="text-[11px] uppercase tracking-[0.08em] font-semibold text-ink-mute mb-2">Blood Information</div>
            <div class="bg-white border border-line rounded-lg p-3.5 mb-4">
              <label class="block text-[12.5px] font-medium text-ink-soft mb-2">Blood Group *</label>
              <div class="grid grid-cols-4 gap-2">
                <template x-for="bg in bloodGroups" :key="bg">
                  <button type="button" @click="registerForm.bloodGroup = bg"
                    :class="registerForm.bloodGroup === bg ? 'bg-blood text-white border-blood' : 'bg-white text-ink border-line hover:border-blood/40'"
                    class="py-2.5 text-[14px] font-bold rounded-md border transition mono" x-text="bg"></button>
                </template>
              </div>
            </div>
            
            <div class="text-[11px] uppercase tracking-[0.08em] font-semibold text-ink-mute mb-2">Donor Status</div>
            <div class="bg-white border border-line rounded-lg p-3.5 mb-4">
              <p class="text-[13.5px] font-medium text-ink mb-1.5">Are you currently available to donate blood?</p>
              <p class="text-[12px] text-ink-soft mb-3 leading-relaxed">People can see your availability when searching for donors.</p>
              <div class="flex gap-2">
                <button type="button" @click="registerForm.available = true"
                  :class="registerForm.available ? 'border-blood bg-blood-tint' : 'border-line bg-white'"
                  class="flex-1 py-3 border-2 rounded-md text-center transition">
                  <div class="w-2.5 h-2.5 rounded-full bg-good mx-auto mb-1.5"></div>
                  <div class="text-[12.5px] font-semibold text-ink">Available</div>
                </button>
                <button type="button" @click="registerForm.available = false"
                  :class="!registerForm.available ? 'border-ink-soft bg-line-soft' : 'border-line bg-white'"
                  class="flex-1 py-3 border-2 rounded-md text-center transition">
                  <div class="w-2.5 h-2.5 rounded-full bg-ink-mute mx-auto mb-1.5"></div>
                  <div class="text-[12.5px] font-semibold text-ink">Not Available</div>
                </button>
              </div>
            </div>
            
            <button type="submit" class="w-full bg-blood text-white py-3.5 rounded-lg font-semibold text-[15px] hover:bg-blood-deep active:scale-[0.99] transition mb-3">
              Create Donor Profile
            </button>
            
            <button type="button" @click="view = 'login'" class="w-full text-center text-[13px] text-ink-soft py-2">
              Already have an account? <span class="text-blood font-semibold">Login</span>
            </button>
          </form>
        </div>
      </div>
    </template>

    <!-- ============== DIRECTORY (Home + Search tabs) ============== -->
    <template x-if="view === 'directory'">
      <div class="view-enter min-h-screen bg-bg">
        <div class="sticky top-0 z-20 bg-bg border-b border-line">
          <div class="bg-white px-4 py-3 flex items-center justify-between border-b border-line-soft">
            <div class="flex items-center gap-2">
              <svg class="w-5 h-5 text-blood" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0c0-5-6.5-12.5-6.5-12.5z"/>
              </svg>
              <h1 class="text-[16px] font-semibold" x-text="activeTab === 'search' ? 'Find Donors' : 'Blood Donors'"></h1>
            </div>
            <button @click="setTab('profile')" class="w-9 h-9 rounded-full flex items-center justify-center text-[12px] font-bold" :class="avatarColor(currentUser.name)" x-text="initials(currentUser.name)" :aria-label="'View your profile'"></button>
          </div>
          
          <div class="px-4 py-2.5 flex gap-2 bg-bg">
            <div class="flex-1 relative">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-ink-mute pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"/>
                <path d="m20 20-3.5-3.5"/>
              </svg>
              <input x-model="searchQuery" type="search" placeholder="Search name, village, blood group..." class="w-full pl-9 pr-3 py-2.5 text-[14px] bg-white border border-line rounded-lg focus:border-blood outline-none" aria-label="Search donors">
            </div>
            <button @click="filterModalOpen = true" class="relative px-3 border border-line rounded-lg bg-white flex items-center gap-1.5 text-[13px] font-medium hover:bg-line-soft" aria-label="Open filters">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 5h18M6 12h12M10 19h4"/>
              </svg>
              <span>Filter</span>
              <span x-show="activeFilterCount > 0" x-cloak class="bg-blood text-white text-[10px] font-bold rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center" x-text="activeFilterCount"></span>
            </button>
          </div>
          
          <div x-show="activeTab === 'search'" x-cloak class="px-4 pb-2.5 flex gap-1.5 overflow-x-auto no-scroll bg-bg">
            <button @click="filters.bloodGroup = 'all'" :class="filters.bloodGroup === 'all' ? 'bg-blood text-white' : 'bg-white text-ink border border-line'" class="px-3 py-1.5 text-[12px] font-semibold rounded-full whitespace-nowrap">All</button>
            <template x-for="bg in bloodGroups" :key="bg">
              <button @click="filters.bloodGroup = bg" :class="filters.bloodGroup === bg ? 'bg-blood text-white' : 'bg-white text-ink border border-line'" class="px-3 py-1.5 text-[12px] font-bold rounded-full whitespace-nowrap mono" x-text="bg"></button>
            </template>
          </div>
        </div>
        
        <div class="px-4 py-3">
          <div class="mb-3">
            <h2 class="text-[18px] font-bold tracking-tight">Find Blood Donors</h2>
            <p class="text-[12.5px] text-ink-soft mt-0.5">
              <span x-text="totalDonors"></span> Donors · <span x-text="availableDonors"></span> Available · 8 Blood Groups
            </p>
          </div>
          
          <div x-show="activeFilterCount > 0" x-cloak class="flex flex-wrap gap-1.5 mb-3">
            <template x-if="filters.bloodGroup !== 'all'">
              <button @click="filters.bloodGroup = 'all'" class="bg-blood-tint text-blood text-[12px] font-medium px-2.5 py-1 rounded-full flex items-center gap-1">
                <span class="mono font-bold" x-text="filters.bloodGroup"></span>
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </template>
            <template x-if="filters.availability !== 'all'">
              <button @click="filters.availability = 'all'" class="bg-blood-tint text-blood text-[12px] font-medium px-2.5 py-1 rounded-full flex items-center gap-1">
                <span x-text="filters.availability === 'available' ? 'Available' : 'Unavailable'"></span>
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </template>
            <template x-if="filters.district !== 'all'">
              <button @click="filters.district = 'all'" class="bg-blood-tint text-blood text-[12px] font-medium px-2.5 py-1 rounded-full flex items-center gap-1">
                <span x-text="filters.district"></span>
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </template>
            <template x-if="filters.donationStatus !== 'all'">
              <button @click="filters.donationStatus = 'all'" class="bg-blood-tint text-blood text-[12px] font-medium px-2.5 py-1 rounded-full flex items-center gap-1">
                <span x-text="formatDonationStatus(filters.donationStatus)"></span>
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </template>
          </div>
          
          <div class="space-y-2.5">
            <template x-if="searching">
              <template x-for="i in 4" :key="i">
                <div class="bg-white border border-line rounded-lg p-3.5">
                  <div class="flex items-start gap-3">
                    <div class="w-11 h-11 rounded-full skeleton"></div>
                    <div class="flex-1">
                      <div class="h-3.5 w-2/3 skeleton mb-2"></div>
                      <div class="h-3 w-1/2 skeleton mb-2"></div>
                      <div class="h-2.5 w-1/3 skeleton"></div>
                    </div>
                  </div>
                  <div class="flex gap-2 mt-3 pt-3 border-t border-line-soft">
                    <div class="flex-1 h-8 skeleton"></div>
                    <div class="flex-1 h-8 skeleton"></div>
                  </div>
                </div>
              </template>
            </template>
            
            <template x-if="!searching && filteredDonors.length === 0">
              <div class="text-center py-12">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-blood-tint flex items-center justify-center">

    </div>
  </div>

  <!-- ============== TOAST ============== -->
  <div x-show="toast.show" x-cloak x-transition class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[60] w-[92%] max-w-[380px]">
    <div class="bg-ink text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2.5 toast-enter">
      <template x-if="toast.type === 'success'">

      <template x-if="toast.type === 'error'">

        </div>
      </template>
      <template x-if="toast.type === 'info'">
        <div class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center flex-shrink-0">
          <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
        </div>
      </template>
      <span class="text-[13.5px] font-medium flex-1" x-text="toast.message"></span>
    </div>
  </div>

</div>

<script>

      { id: 2, name: 'Abdul Karim', username: 'abdul_karim', phone: '01822334455', bloodGroup: 'A+', village: 'Kachua', union: 'Kachua Union', district: 'Chandpur', available: false, donations: [{ id: 1, date: '2026-07-20', location: 'Chandpur Sadar Hospital', type: 'Whole Blood', status: 'Completed' }] },
      { id: 3, name: 'Nusrat Jahan', username: 'nusrat_jahan', phone: '01988776655', bloodGroup: 'B+', village: 'Cumilla Sadar', union: 'Cumilla Union', district: 'Cumilla', available: true, donations: [{ id: 1, date: '2026-06-03', location: 'Cumilla Medical College', type: 'Platelets', status: 'Completed' }] },
      { id: 4, name: 'Tanvir Hasan', username: 'tanvir_hasan', phone: '01766554433', bloodGroup: 'AB+', village: 'Mirpur', union: 'Mirpur Union', district: 'Dhaka', available: true, donations: [] },
      { id: 5, name: 'Fahmida Akter', username: 'fahmida_akter', phone: '01622330011', bloodGroup: 'O-', village: 'Daudkandi', union: 'Daudkandi Union', district: 'Cumilla', available: false, donations: [{ id: 1, date: '2025-11-15', location: 'Daudkandi Health Complex', type: 'Whole Blood', status: 'Completed' }] },
      { id: 6, name: 'Imran Hossain', username: 'imran_hossain', phone: '01566778899', bloodGroup: 'A-', village: 'Brahmanbaria', union: 'Brahmanbaria Union', district: 'Cumilla', available: true, donations: [{ id: 1, date: '2026-09-01', location: 'Brahmanbaria Hospital', type: 'Whole Blood', status: 'Completed' }] },
      { id: 7, name: 'Sadia Islam', username: 'sadia_islam', phone: '01799887766', bloodGroup: 'B-', village: 'Sonaimuri', union: 'Sonaimuri Union', district: 'Noakhali', available: false, donations: [] },
      { id: 8, name: 'Rakibul Islam', username: 'rakibul_islam', phone: '01877553311', bloodGroup: 'O+', village: 'Sitakunda', union: 'Sitakunda Union', district: 'Chattogram', available: true, donations: [{ id: 1, date: '2026-05-22', location: 'Sitakunda Health Complex', type: 'Whole Blood', status: 'Completed' }] },
      { id: 9, name: 'Mitu Akter', username: 'mitu_akter', phone: '01933221100', bloodGroup: 'AB-', village: 'Patiya', union: 'Patiya Union', district: 'Chattogram', available: true, donations: [{ id: 1, date: '2026-02-10', location: 'Patiya Upazila Health Complex', type: 'Plasma', status: 'Completed' }] },
      { id: 10, name: 'Jamal Uddin', username: 'jamal_uddin', phone: '01755443322', bloodGroup: 'A+', village: 'Raozan', union: 'Raozan Union', district: 'Chattogram', available: false, donations: [{ id: 1, date: '2026-08-25', location: 'Raozan Hospital', type: 'Whole Blood', status: 'Completed' }] },
      { id: 11, name: 'Shahidul Alam', username: 'shahidul_alam', phone: '01899001122', bloodGroup: 'B+', village: 'Sandwip', union: 'Sandwip Union', district: 'Chattogram', available: true, donations: [{ id: 1, date: '2026-07-15', location: 'Sandwip Health Complex', type: 'Whole Blood', status: 'Completed' }] },
      { id: 12, name: 'Nasrin Sultana', username: 'nasrin_sultana', phone: '01644556677', bloodGroup: 'O+', village: 'Fatikchhari', union: 'Fatikchhari Union', district: 'Chattogram', available: true, donations: [] },
      { id: 13, name: 'Anwar Hossain', username: 'anwar_hossain', phone: '01577889900', bloodGroup: 'A-', village: 'Hathazari', union: 'Hathazari Union', district: 'Chattogram', available: false, donations: [{ id: 1, date: '2026-09-10', location: 'Hathazari Hospital', type: 'Platelets', status: 'Completed' }] },
      { id: 14, name: 'Rumana Akter', username: 'rumana_akter', phone: '01722334488', bloodGroup: 'AB+', village: 'Chandgaon', union: 'Chandgaon Union', district: 'Chattogram', available: true, donations: [{ id: 1, date: '2026-04-18', location: 'Chattogram Medical College', type: 'Whole Blood', status: 'Completed' }] },
      { id: 15, name: 'Belal Uddin', username: 'belal_uddin', phone: '01866778822', bloodGroup: 'B+', village: 'Anwara', union: 'Anwara Union', district: 'Chattogram', available: false, donations: [{ id: 1, date: '2025-10-05', location: 'Anwara Health Complex', type: 'Whole Blood', status: 'Completed' }] },
      { id: 16, name: 'Kamrul Hasan', username: 'kamrul_hasan', phone: '01988770011', bloodGroup: 'O-', village: 'Banshkhali', union: 'Banshkhali Union', district: 'Chattogram', available: true, donations: [{ id: 1, date: '2026-06-28', location: 'Banshkhali Hospital', type: 'Whole Blood', status: 'Completed' }] },
      { id: 17, name: 'Shila Akter', username: 'shila_akter', phone: '01655440033', bloodGroup: 'A+', village: 'Lohagara', union: 'Lohagara Union', district: 'Chattogram', available: true, donations: [] },
      { id: 18, name: 'Mizanur Rahman', username: 'mizanur_rahman', phone: '01733221166', bloodGroup: 'B-', village: 'Satkania', union: 'Satkania Union', district: 'Chattogram', available: false, donations: [{ id: 1, date: '2026-08-30', location: 'Satkania Hospital', type: 'Whole Blood', status: 'Completed' }] },
    ],
    
    get usernameStatus() {
      const u = this.registerForm.username.trim().toLowerCase();
      if (!u) return 'empty';
      if (u.length < 3) return 'short';
      const taken = this.donors.some(d => d.username.toLowerCase() === u) || u === this.currentUser.username.toLowerCase();
      return taken ? 'taken' : 'available';
    },
    
    get filteredDonors() {
      let list = this.donors.filter(d => d.id !== this.currentUser.id);
      
      if (this.searchQuery.trim()) {
        const q = this.searchQuery.trim().toLowerCase();
        list = list.filter(d => 
          d.name.toLowerCase().includes(q) ||
          d.username.toLowerCase().includes(q) ||
          d.bloodGroup.toLowerCase().includes(q) ||
          d.village.toLowerCase().includes(q) ||
          d.union.toLowerCase().includes(q) ||
          d.district.toLowerCase().includes(q)
        );
      }
      
      if (this.filters.bloodGroup !== 'all') {
        list = list.filter(d => d.bloodGroup === this.filters.bloodGroup);
      }
      if (this.filters.availability !== 'all') {
        list = list.filter(d => this.filters.availability === 'available' ? d.available : !d.available);
      }
      if (this.filters.district !== 'all') {
        list = list.filter(d => d.district === this.filters.district);
      }
      if (this.filters.donationStatus !== 'all') {
        const now = new Date();
        list = list.filter(d => {
          if (this.filters.donationStatus === 'never') return d.donations.length === 0;
          if (this.filters.donationStatus === 'recent') {
            if (d.donations.length === 0) return false;
            const last = new Date(d.donations[0].date);
            const days = (now - last) / (1000 * 60 * 60 * 24);
            return days <= 90;
          }
          if (this.filters.donationStatus === 'before') return d.donations.length > 0;
          return true;
        });
      }
      return list;
    },
    
    get activeFilterCount() {
      let c = 0;
      if (this.filters.bloodGroup !== 'all') c++;
      if (this.filters.availability !== 'all') c++;
      if (this.filters.district !== 'all') c++;
      if (this.filters.donationStatus !== 'all') c++;
      return c;
    },
    
    get totalDonors() { return this.donors.length; },
    get availableDonors() { return this.donors.filter(d => d.available).length; },
    
    get selectedDonor() {
      if (!this.selectedDonorId) return null;
      return this.donors.find(d => d.id === this.selectedDonorId) || null;
    },
    
    get showBottomNav() {
      return ['directory', 'myProfile', 'history', 'donorProfile', 'editProfile', 'settings'].includes(this.view);
    },
    
    init() {
      this.$watch('searchQuery', () => {
        clearTimeout(this.searchTimer);
        this.searching = true;
        this.searchTimer = setTimeout(() => { this.searching = false; }, 400);
      });
    },
    
    navigate(v) {
      this.view = v;
      window.scrollTo(0, 0);
    },
    
    setTab(tab) {
      this.activeTab = tab;
      if (tab === 'home' || tab === 'search') {
        this.view = 'directory';
      } else if (tab === 'history') {
        this.view = 'history';
      } else if (tab === 'profile') {
        this.view = 'myProfile';
      }
      window.scrollTo(0, 0);
    },
    
    submitLogin() {
      if (!this.loginForm.identifier.trim()) {
        this.showToast('Please enter your phone or username', 'error');
        return;
      }
      this.showToast('Logged in successfully', 'success');
      this.activeTab = 'home';
      this.view = 'directory';
      this.loginForm = { identifier: '', password: '' };
    },
    
    submitRegister() {
      if (!this.registerForm.name.trim() || !this.registerForm.phone.trim() || !this.registerForm.username.trim()) {
        this.showToast('Please fill all required fields', 'error');
        return;
      }
      if (!this.registerForm.bloodGroup) {
        this.showToast('Please select your blood group', 'error');
        return;
      }
      if (!this.registerForm.district) {
        this.showToast('Please select your district', 'error');
        return;
      }
      if (this.usernameStatus === 'taken') {
        this.showToast('Username already taken', 'error');
        return;
      }
      
      this.currentUser = {
        ...this.currentUser,
        name: this.registerForm.name,
        username: this.registerForm.username,
        phone: this.registerForm.phone,
        bloodGroup: this.registerForm.bloodGroup,
        village: this.registerForm.village || 'Not specified',
        union: this.registerForm.union || 'Not specified',
        district: this.registerForm.district,
        available: this.registerForm.available,
        donations: []
      };
      
      this.showToast('Profile created successfully', 'success');
      this.activeTab = 'home';
      this.view = 'directory';
      this.registerForm = { name: '', phone: '', username: '', district: '', union: '', village: '', bloodGroup: '', available: true };
    },
    
    openDonor(id) {
      this.selectedDonorId = id;
      this.view = 'donorProfile';
      window.scrollTo(0, 0);
    },
    
    callDonor(phone) {
      this.callPhoneNumber = phone;
      this.callConfirmOpen = true;
    },
    
    clearSearch() {
      this.searchQuery = '';
      this.clearFilters();
    },
    
    clearFilters() {
      this.filters = { bloodGroup: 'all', availability: 'all', district: 'all', donationStatus: 'all' };
      this.showToast('Filters cleared', 'info');
    },
    
    openEditProfile() {
      this.editForm = JSON.parse(JSON.stringify(this.currentUser));
      this.view = 'editProfile';
      window.scrollTo(0, 0);
    },
    
    saveProfile() {
      this.currentUser = { ...this.currentUser, ...this.editForm };
      this.showToast('Profile updated successfully', 'success');
      this.view = 'myProfile';
      window.scrollTo(0, 0);
    },
    
    toggleAvailability() {
      this.currentUser.available = !this.currentUser.available;
      if (this.currentUser.available) this.currentUser.unavailableReason = '';
      this.showToast(this.currentUser.available ? 'You are now available' : 'You are now unavailable', 'info');
    },
    
    saveDonation() {
      if (!this.newDonation.date || !this.newDonation.location) {
        this.showToast('Please fill required fields', 'error');
        return;
      }
      const donation = {
        id: Date.now(),
        date: this.newDonation.date,
        location: this.newDonation.location,
        type: this.newDonation.type,
        hospital: this.newDonation.hospital,
        notes: this.newDonation.notes,
        status: 'Completed'
      };
      this.currentUser.donations.unshift(donation);
      this.currentUser.donations.sort((a, b) => new Date(b.date) - new Date(a.date));
      this.addDonationOpen = false;
      this.newDonation = { date: '', location: '', type: 'Whole Blood', hospital: '', notes: '' };
      this.showToast('Donation record added', 'success');
    },
    
    logout() {
      this.logoutConfirmOpen = true;
    },
    
    confirmLogout() {
      this.logoutConfirmOpen = false;
      this.view = 'splash';
      this.activeTab = 'home';
      this.searchQuery = '';
      this.clearFilters();
      this.showToast('Logged out successfully', 'info');
    },
    
    showToast(message, type = 'success') {
      clearTimeout(this.toastTimer);
      this.toast = { show: true, message, type };
      this.toastTimer = setTimeout(() => { this.toast.show = false; }, 2800);
    },
    
    initials(name) {
      if (!name) return '?';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    },
    
    avatarColor(name) {
      if (!name) return 'avatar-a';
      const colors = ['avatar-a', 'avatar-b', 'avatar-c', 'avatar-d'];
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    },
    
    formatDate(dateStr) {
      if (!dateStr) return '';
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const d = new Date(dateStr);
      return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    },
    
    formatDonationStatus(s) {
      const map = { never: 'Never Donated', recent: 'Recently Donated', before: 'Donated Before' };
      return map[s] || s;
    }
  };
}
</script>
